name: CI/CD Pipeline

# Triggers: every push to main, every pull request, or manually.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One pipeline at a time per branch: a new push cancels the previous run.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only reads the repository.
permissions:
  contents: read

jobs:
  # ─────────────────────────────── STAGE 1 ───────────────────────────────
  lint:
    name: Stage 1 · Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint — syntax of every script
        run: npm run lint

      - name: Lint — no secret committed to the repository
        run: |
          echo "Scanning the repository for sensitive files…"
          # .env.example is committed on purpose: it holds no values.
          SENSITIVE=$(git ls-files \
            | grep -E '^(\.env($|\..*)|\.dev\.vars|private/|.*\.pem$|.*\.key$)' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$SENSITIVE" ]; then
            echo "$SENSITIVE"
            echo "::error::A sensitive file is committed"
            exit 1
          fi
          echo "✔ No sensitive file committed"

  # ─────────────────────────────── STAGE 2 ───────────────────────────────
  unit-tests:
    name: Stage 2 · Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Unit tests — pricing (rates, forfaits, VAT)
        run: node --test tests/pricing.test.js

      - name: Unit tests — security guard (bots, rate limit)
        run: node --test tests/guard.test.js

      - name: Unit tests — SEO (meta tags, robots, sitemap, links)
        run: node --test tests/seo.test.js

      - name: Test report
        if: always()
        run: |
          {
            echo "### Stage 2 · Unit Tests"
            echo ""
            echo "| Suite | File |"
            echo "|---|---|"
            echo "| Pricing and forfaits | \`tests/pricing.test.js\` |"
            echo "| Abuse protection | \`tests/guard.test.js\` |"
            echo "| SEO and published content | \`tests/seo.test.js\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────── STAGE 3 ───────────────────────────────
  build:
    name: Stage 3 · Build
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build — assemble the publishable folder
        run: |
          mkdir -p dist
          cp -r public/. dist/
          echo "Files ready to publish:"
          find dist -type f | sort

      - name: Build — check total size
        run: |
          SIZE=$(du -sk dist | cut -f1)
          echo "Total size: ${SIZE} KB"
          if [ "$SIZE" -gt 5120 ]; then
            echo "::error::The site exceeds 5 MB (${SIZE} KB)"
            exit 1
          fi
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Build — verify required files
        run: |
          for f in index.html styles.css script.js robots.txt sitemap.xml favicon.svg; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
            echo "✔ $f"
          done

      - name: Upload build artifact (kept 30 days)
        uses: actions/upload-artifact@v7
        with:
          name: site-aa-vtc
          path: dist
          retention-days: 30

      - name: Build report
        run: |
          {
            echo "### Stage 3 · Build"
            echo ""
            echo "- Files: **$(find dist -type f | wc -l)**"
            echo "- Size: **${SIZE} KB**"
            echo "- Artifact: \`site-aa-vtc\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────── STAGE 4 — OVH ─────────────────────────────
  deploy-ovh:
    name: Stage 4 · Deploy to OVH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production-ovh
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: site-aa-vtc
          path: dist

      - name: Check OVH credentials
        id: config
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          if [ -n "$OVH_HOST" ] && [ -n "$OVH_USER" ] && [ -n "$OVH_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✔ OVH credentials configured"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OVH secrets missing — OVH deployment skipped"
          fi

      - name: Install transfer client (lftp)
        if: steps.config.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy to OVH over SFTP
        if: steps.config.outputs.ready == 'true'
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_DIR: ${{ vars.OVH_REMOTE_DIR || '/www' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            open -u \"$OVH_USER\",\"$OVH_PASS\" sftp://$OVH_HOST;
            mirror --reverse --delete --verbose=1 --parallel=4 dist/ $OVH_DIR;
          "
          echo "✔ Site deployed to $OVH_DIR"

      - name: Deployment report
        if: always()
        run: |
          if [ "${{ steps.config.outputs.ready }}" = "true" ]; then
            echo "### Stage 4 · OVH — deployed ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Stage 4 · OVH — skipped (secrets not configured) ⏭️" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────── STAGE 4 — CLOUDFLARE ─────────────────────────
  deploy-cloudflare:
    name: Stage 4 · Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://aa-vtc.fr
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare API token
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✔ Cloudflare token configured"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN missing — Cloudflare deployment skipped"
          fi

      - name: Deploy Worker and static assets
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deployment report
        if: always()
        run: |
          if [ "${{ steps.config.outputs.ready }}" = "true" ]; then
            echo "### Stage 4 · Cloudflare — deployed to https://aa-vtc.fr ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Stage 4 · Cloudflare — skipped (token not configured) ⏭️" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────── STAGE 5 ───────────────────────────────
  smoke-tests:
    name: Stage 5 · Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-ovh, deploy-cloudflare]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Smoke test — site responds over HTTPS
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 https://aa-vtc.fr/)
          echo "https://aa-vtc.fr/ → $CODE"
          test "$CODE" = "200" || { echo "::error::Site is down (HTTP $CODE)"; exit 1; }

      - name: Smoke test — canonical redirects work
        run: |
          for H in www.aa-vtc.fr aa-vtc.com www.aa-vtc.com; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$H/")
            TARGET=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 30 "https://$H/")
            echo "$H → $CODE $TARGET"
            test "$CODE" = "301" || { echo "::error::$H does not redirect (HTTP $CODE)"; exit 1; }
          done

      - name: Smoke test — canonical tag is correct
        run: |
          curl -s --max-time 30 https://aa-vtc.fr/ | grep -q 'rel="canonical" href="https://aa-vtc.fr/"' \
            || { echo "::error::canonical tag missing or wrong"; exit 1; }
          echo "✔ canonical = https://aa-vtc.fr/"

      - name: Smoke test — robots.txt and sitemap.xml are served
        run: |
          curl -s --max-time 30 https://aa-vtc.fr/robots.txt | grep -q 'Sitemap: https://aa-vtc.fr/sitemap.xml' \
            || { echo "::error::robots.txt is wrong"; exit 1; }
          curl -s --max-time 30 https://aa-vtc.fr/sitemap.xml | grep -q '<loc>https://aa-vtc.fr/</loc>' \
            || { echo "::error::sitemap.xml is wrong"; exit 1; }
          echo "✔ robots.txt and sitemap.xml are correct"

      - name: Smoke test — security headers are present
        run: |
          HEADERS=$(curl -s -I --max-time 30 https://aa-vtc.fr/)
          for H in "strict-transport-security" "content-security-policy" "x-frame-options" "x-content-type-options"; do
            echo "$HEADERS" | grep -qi "^$H:" || { echo "::error::header $H is missing"; exit 1; }
            echo "✔ $H"
          done

      - name: Smoke test — fare estimator answers
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST https://aa-vtc.fr/api/fare \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://aa-vtc.fr' \
            -H 'User-Agent: Mozilla/5.0 (CI AA-VTC)' \
            -d '{"origin":{"lat":49.4944,"lng":0.1079},"destination":{"lat":49.1771,"lng":-0.4573}}')
          echo "POST /api/fare → $CODE"
          # 502/503/504 means our Worker is alive and correctly reporting that the
          # IGN Géoplateforme upstream is unavailable. The page degrades to a
          # WhatsApp quote request, so that is a warning, not a failed deployment.
          case "$CODE" in
            200) echo "✔ estimator answered" ;;
            502|503|504) echo "::warning::IGN upstream unavailable (HTTP $CODE) — estimator degraded, site otherwise healthy" ;;
            *) echo "::error::fare estimator is broken (HTTP $CODE)"; exit 1 ;;
          esac

      - name: Smoke test — API rejects automated clients
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST https://aa-vtc.fr/api/fare -H 'Content-Type: application/json' -d '{}')
          echo "POST without Origin (curl) → $CODE"
          test "$CODE" = "403" || { echo "::error::API should have rejected this (HTTP $CODE)"; exit 1; }
          echo "✔ automated clients are blocked"

      - name: Smoke test report
        if: always()
        run: |
          {
            echo "### Stage 5 · Smoke Tests"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| https://aa-vtc.fr responds | ✅ |"
            echo "| Canonical redirects (www, .com) | ✅ |"
            echo "| Canonical tag | ✅ |"
            echo "| robots.txt and sitemap.xml | ✅ |"
            echo "| Security headers | ✅ |"
            echo "| Fare estimator | ✅ |"
            echo "| API blocks bots | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
