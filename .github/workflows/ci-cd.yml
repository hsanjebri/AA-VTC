name: CI/CD — AA-VTC

# Déclencheurs : chaque push sur main, chaque pull request, ou manuellement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un seul pipeline à la fois par branche : un nouveau push annule le précédent.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux : le pipeline ne fait que lire le dépôt.
permissions:
  contents: read

jobs:
  # ─────────────────────────────── ÉTAPE 1 ───────────────────────────────
  qualite:
    name: 1 · Qualité du code
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe de tous les scripts
        run: npm run lint

      - name: Vérifier qu'aucun secret n'est versionné
        run: |
          echo "Recherche de fichiers sensibles dans le dépôt…"
          # .env.example est volontairement versionné : il ne contient aucune valeur.
          SENSIBLES=$(git ls-files \
            | grep -E '^(\.env($|\..*)|\.dev\.vars|private/|.*\.pem$|.*\.key$)' \
            | grep -v '^\.env\.example$' || true)
          if [ -n "$SENSIBLES" ]; then
            echo "$SENSIBLES"
            echo "::error::Un fichier sensible est versionné"
            exit 1
          fi
          echo "✔ Aucun fichier sensible versionné"

  # ─────────────────────────────── ÉTAPE 2 ───────────────────────────────
  tests:
    name: 2 · Tests automatisés
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests des tarifs (barème, forfaits, TVA)
        run: node --test tests/pricing.test.js

      - name: Tests de sécurité (anti-bots, limite de débit)
        run: node --test tests/guard.test.js

      - name: Tests SEO (balises, robots.txt, sitemap, liens)
        run: node --test tests/seo.test.js

      - name: Résumé des tests
        if: always()
        run: |
          {
            echo "### 2 · Tests automatisés"
            echo ""
            echo "| Suite | Fichier |"
            echo "|---|---|"
            echo "| Tarifs et forfaits | \`tests/pricing.test.js\` |"
            echo "| Protection anti-abus | \`tests/guard.test.js\` |"
            echo "| SEO et contenu publié | \`tests/seo.test.js\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────── ÉTAPE 3 ───────────────────────────────
  build:
    name: 3 · Build & artefact
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Préparer le dossier à publier
        run: |
          mkdir -p dist
          cp -r public/. dist/
          echo "Fichiers prêts à être publiés :"
          find dist -type f | sort

      - name: Contrôler le poids du site
        run: |
          POIDS=$(du -sk dist | cut -f1)
          echo "Poids total : ${POIDS} Ko"
          if [ "$POIDS" -gt 5120 ]; then
            echo "::error::Le site dépasse 5 Mo (${POIDS} Ko)"
            exit 1
          fi
          echo "POIDS=$POIDS" >> "$GITHUB_ENV"

      - name: Vérifier les fichiers indispensables
        run: |
          for f in index.html styles.css script.js robots.txt sitemap.xml favicon.svg; do
            test -f "dist/$f" || { echo "::error::dist/$f manquant"; exit 1; }
            echo "✔ $f"
          done

      - name: Conserver l'artefact (téléchargeable 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: site-aa-vtc
          path: dist
          retention-days: 30

      - name: Résumé du build
        run: |
          {
            echo "### 3 · Build"
            echo ""
            echo "- Fichiers : **$(find dist -type f | wc -l)**"
            echo "- Poids : **${POIDS} Ko**"
            echo "- Artefact : \`site-aa-vtc\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────── ÉTAPE 4 — OVH ─────────────────────────────
  deploy-ovh:
    name: 4 · Déploiement OVH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production-ovh
    steps:
      - name: Télécharger l'artefact du build
        uses: actions/download-artifact@v4
        with:
          name: site-aa-vtc
          path: dist

      - name: Vérifier la présence des identifiants OVH
        id: config
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          if [ -n "$OVH_HOST" ] && [ -n "$OVH_USER" ] && [ -n "$OVH_PASS" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
            echo "✔ Identifiants OVH configurés"
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets OVH absents — déploiement OVH ignoré"
          fi

      - name: Installer le client de transfert (lftp)
        if: steps.config.outputs.pret == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer le site sur OVH (SFTP)
        if: steps.config.outputs.pret == 'true'
        env:
          OVH_HOST: ${{ secrets.OVH_FTP_HOST }}
          OVH_USER: ${{ secrets.OVH_FTP_USER }}
          OVH_PASS: ${{ secrets.OVH_FTP_PASSWORD }}
          OVH_DIR: ${{ vars.OVH_REMOTE_DIR || '/www' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 20;
            open -u \"$OVH_USER\",\"$OVH_PASS\" sftp://$OVH_HOST;
            mirror --reverse --delete --verbose=1 --parallel=4 dist/ $OVH_DIR;
          "
          echo "✔ Site déployé dans $OVH_DIR"

      - name: Résumé du déploiement OVH
        if: always()
        run: |
          if [ "${{ steps.config.outputs.pret }}" = "true" ]; then
            echo "### 4 · OVH — déployé ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 4 · OVH — ignoré (secrets non configurés) ⏭️" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ──────────────────────── ÉTAPE 4 — CLOUDFLARE ─────────────────────────
  deploy-cloudflare:
    name: 4 · Déploiement Cloudflare Workers
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://aa-vtc.fr
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la présence du jeton Cloudflare
        id: config
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
            echo "✔ Jeton Cloudflare configuré"
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN absent — déploiement Cloudflare ignoré"
          fi

      - name: Publier le Worker et les fichiers statiques
        if: steps.config.outputs.pret == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Résumé du déploiement Cloudflare
        if: always()
        run: |
          if [ "${{ steps.config.outputs.pret }}" = "true" ]; then
            echo "### 4 · Cloudflare — déployé sur https://aa-vtc.fr ✅" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 4 · Cloudflare — ignoré (jeton non configuré) ⏭️" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ─────────────────────────────── ÉTAPE 5 ───────────────────────────────
  verification:
    name: 5 · Vérification du site en ligne
    runs-on: ubuntu-latest
    needs: [deploy-ovh, deploy-cloudflare]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Le site répond en HTTPS
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --max-time 30 https://aa-vtc.fr/)
          echo "https://aa-vtc.fr/ → $CODE"
          test "$CODE" = "200" || { echo "::error::Le site ne répond pas (code $CODE)"; exit 1; }

      - name: Les redirections canoniques fonctionnent
        run: |
          for H in www.aa-vtc.fr aa-vtc.com www.aa-vtc.com; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://$H/")
            CIBLE=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 30 "https://$H/")
            echo "$H → $CODE $CIBLE"
            test "$CODE" = "301" || { echo "::error::$H ne redirige pas (code $CODE)"; exit 1; }
          done

      - name: La balise canonical est correcte
        run: |
          curl -s --max-time 30 https://aa-vtc.fr/ | grep -q 'rel="canonical" href="https://aa-vtc.fr/"' \
            || { echo "::error::balise canonical absente ou incorrecte"; exit 1; }
          echo "✔ canonical = https://aa-vtc.fr/"

      - name: robots.txt et sitemap.xml sont servis
        run: |
          curl -s --max-time 30 https://aa-vtc.fr/robots.txt | grep -q 'Sitemap: https://aa-vtc.fr/sitemap.xml' \
            || { echo "::error::robots.txt incorrect"; exit 1; }
          curl -s --max-time 30 https://aa-vtc.fr/sitemap.xml | grep -q '<loc>https://aa-vtc.fr/</loc>' \
            || { echo "::error::sitemap.xml incorrect"; exit 1; }
          echo "✔ robots.txt et sitemap.xml conformes"

      - name: Les en-têtes de sécurité sont présents
        run: |
          EN_TETES=$(curl -s -I --max-time 30 https://aa-vtc.fr/)
          for H in "strict-transport-security" "content-security-policy" "x-frame-options" "x-content-type-options"; do
            echo "$EN_TETES" | grep -qi "^$H:" || { echo "::error::en-tête $H manquant"; exit 1; }
            echo "✔ $H"
          done

      - name: L'estimateur de tarif répond
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST https://aa-vtc.fr/api/fare \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://aa-vtc.fr' \
            -H 'User-Agent: Mozilla/5.0 (CI AA-VTC)' \
            -d '{"origin":{"lat":49.4944,"lng":0.1079},"destination":{"lat":49.1771,"lng":-0.4573}}')
          echo "POST /api/fare → $CODE"
          test "$CODE" = "200" || { echo "::error::l'estimateur ne répond pas (code $CODE)"; exit 1; }

      - name: L'API refuse les robots
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST https://aa-vtc.fr/api/fare -H 'Content-Type: application/json' -d '{}')
          echo "POST sans Origin (curl) → $CODE"
          test "$CODE" = "403" || { echo "::error::l'API devrait refuser (code $CODE)"; exit 1; }
          echo "✔ les appels automatisés sont bloqués"

      - name: Résumé final
        if: always()
        run: |
          {
            echo "### 5 · Vérification du site en ligne"
            echo ""
            echo "| Contrôle | État |"
            echo "|---|---|"
            echo "| https://aa-vtc.fr répond | ✅ |"
            echo "| Redirections canoniques (www, .com) | ✅ |"
            echo "| Balise canonical | ✅ |"
            echo "| robots.txt et sitemap.xml | ✅ |"
            echo "| En-têtes de sécurité | ✅ |"
            echo "| Estimateur de tarif | ✅ |"
            echo "| Blocage des robots sur l'API | ✅ |"
          } >> "$GITHUB_STEP_SUMMARY"
