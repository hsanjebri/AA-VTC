<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>AA-VTC · Administration</title>
  <meta name="theme-color" content="#0B1E3D">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- ============ LOGIN ============ -->
  <main class="login" id="login-view" hidden>
    <div class="login__card">
      <span class="brand">
        <span class="brand__mark">AA</span><span class="brand__rule" aria-hidden="true"></span><span class="brand__name">VTC</span>
      </span>
      <h1 class="login__title">Administration</h1>
      <p class="login__text">Connectez-vous pour gérer vos réservations.</p>
      <form id="login-form" novalidate>
        <p class="msg msg--error" id="login-error" hidden></p>
        <div>
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" autocomplete="username" required>
        </div>
        <div>
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn--gold btn--block" type="submit" id="login-submit">Se connecter</button>
      </form>
    </div>
  </main>

  <!-- ============ APP ============ -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <span class="brand">
        <span class="brand__mark">AA</span><span class="brand__rule" aria-hidden="true"></span><span class="brand__name">VTC</span>
      </span>
      <div class="topbar__right">
        <span id="session-email"></span>
        <button class="btn btn--line btn--sm" type="button" id="logout">Déconnexion</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-dashboard" aria-controls="view-dashboard" aria-selected="true">Tableau de bord</button>
      <button class="tab" role="tab" id="tab-bookings" aria-controls="view-bookings" aria-selected="false">Réservations</button>
      <button class="tab" role="tab" id="tab-planning" aria-controls="view-planning" aria-selected="false">Planning</button>
      <button class="tab" role="tab" id="tab-clients" aria-controls="view-clients" aria-selected="false">Clients</button>
      <button class="tab" role="tab" id="tab-devis" aria-controls="view-devis" aria-selected="false">Devis</button>
    </nav>

    <!-- Tableau de bord -->
    <main class="view" id="view-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" tabindex="-1">
      <div class="view__head">
        <h1 class="view__title">Tableau de bord</h1>
        <button class="btn btn--gold btn--sm" type="button" data-new-booking>Nouvelle réservation</button>
      </div>
      <ul class="stats" id="stat-tiles"></ul>
      <section class="card" style="margin-top: 14px;" aria-labelledby="today-title">
        <div class="card__head">
          <h2 class="card__title" id="today-title">Aujourd'hui</h2>
          <button class="link-btn" type="button" data-goto="planning">Voir le planning</button>
        </div>
        <div id="today-list"></div>
      </section>
      <div class="grid-2">
        <section class="card" aria-labelledby="revenue-title">
          <div class="card__head">
            <h2 class="card__title" id="revenue-title">Chiffre d'affaires HT par mois</h2>
            <button class="link-btn" type="button" id="revenue-table-toggle" aria-expanded="false">Voir le tableau</button>
          </div>
          <div id="revenue-chart"></div>
          <div id="revenue-table" hidden></div>
        </section>
        <section class="card" aria-labelledby="routes-title">
          <div class="card__head">
            <h2 class="card__title" id="routes-title">Trajets les plus demandés</h2>
            <span class="card__note">Hors annulées</span>
          </div>
          <div id="top-routes"></div>
        </section>
      </div>
      <section class="card" style="margin-top: 14px;" aria-labelledby="recent-title">
        <div class="card__head">
          <h2 class="card__title" id="recent-title">Dernières demandes</h2>
          <button class="link-btn" type="button" data-goto="bookings">Tout voir</button>
        </div>
        <div id="recent-bookings"></div>
      </section>
    </main>

    <!-- Réservations -->
    <main class="view" id="view-bookings" role="tabpanel" aria-labelledby="tab-bookings" tabindex="-1" hidden>
      <div class="view__head">
        <h1 class="view__title">Réservations</h1>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn--line btn--sm" type="button" id="export-csv">Exporter en CSV</button>
          <button class="btn btn--gold btn--sm" type="button" data-new-booking>Nouvelle réservation</button>
        </div>
      </div>
      <div class="filters">
        <div>
          <label for="filter-status">Statut</label>
          <select id="filter-status">
            <option value="">Tous</option>
            <option value="nouveau">Nouveau</option>
            <option value="confirme">Confirmé</option>
            <option value="termine">Terminé</option>
            <option value="annule">Annulé</option>
          </select>
        </div>
        <div>
          <label for="filter-from">Du</label>
          <input type="date" id="filter-from">
        </div>
        <div>
          <label for="filter-to">Au</label>
          <input type="date" id="filter-to">
        </div>
        <div style="flex:1; min-width: 200px;">
          <label for="filter-q">Recherche</label>
          <input type="search" id="filter-q" placeholder="Référence, client, trajet…">
        </div>
      </div>
      <div id="bookings-list"></div>
    </main>

    <!-- Planning -->
    <main class="view" id="view-planning" role="tabpanel" aria-labelledby="tab-planning" tabindex="-1" hidden>
      <div class="view__head">
        <h1 class="view__title">Planning</h1>
        <div class="filters" style="margin:0;">
          <button class="btn btn--line btn--sm" type="button" id="planning-prev">← Semaine précédente</button>
          <button class="btn btn--line btn--sm" type="button" id="planning-today">Cette semaine</button>
          <button class="btn btn--line btn--sm" type="button" id="planning-next">Semaine suivante →</button>
        </div>
      </div>
      <p class="card__note" id="planning-range" style="margin-bottom:14px;"></p>
      <div class="planning" id="planning-days"></div>
    </main>

    <!-- Clients -->
    <main class="view" id="view-clients" role="tabpanel" aria-labelledby="tab-clients" tabindex="-1" hidden>
      <div class="view__head">
        <h1 class="view__title">Clients</h1>
        <div style="min-width:220px;">
          <label for="clients-q" class="sr-only">Rechercher un client</label>
          <input type="search" id="clients-q" placeholder="Nom, téléphone, e-mail…">
        </div>
      </div>
      <div id="clients-list"></div>
    </main>

    <!-- Devis -->
    <main class="view" id="view-devis" role="tabpanel" aria-labelledby="tab-devis" tabindex="-1" hidden>
      <div class="view__head">
        <h1 class="view__title">Devis</h1>
        <button class="btn btn--gold btn--sm" type="button" id="new-devis">Nouveau devis</button>
      </div>
      <div id="devis-list"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
